[package]
name = "catbowl"
version = "0.1.0"
authors = ["Eddie1O <andrzej.witowski@itinberlin.de>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[[bin]]
name = "catbowl"
path = "src/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "1.2.0", features = ["esp32c3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32c3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
log = "0.4.28"
nb = "1.1.0"
# Pin: cargo otherwise picks enumset 1.1.3, which cannot parse
# esp-hal 1.2 WakeupSource discriminants generated via macro_rules.
enumset = "1.1.14"

[profile.dev]
opt-level = "s"
incremental = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
